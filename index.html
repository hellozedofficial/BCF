<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d19">
    <title>BCF | Carrom Federation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #080d19;
            color: #ffffff;
        }

        .opening {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 40%,
                    rgba(196, 151, 66, 0.12),
                    transparent 36%),
                linear-gradient(145deg, #080d19, #101a2c 55%, #080d19);
        }

        .opening::before {
            content: "";
            position: absolute;
            inset: 22px;
            border: 1px solid rgba(211, 174, 99, 0.25);
            pointer-events: none;
        }

        .opening::after {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border: 1px solid rgba(211, 174, 99, 0.09);
            border-radius: 50%;
            box-shadow:
                0 0 0 45px rgba(211, 174, 99, 0.025),
                0 0 0 90px rgba(211, 174, 99, 0.02);
            pointer-events: none;
        }

        .content {
            width: 100%;
            max-width: 680px;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: reveal 1s ease both;
        }

        .logo-wrap {
            width: 154px;
            height: 154px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.025);
            box-shadow: 0 0 55px rgba(211, 174, 99, 0.08);
            overflow: hidden;
        }

        .logo {
            width: 84%;
            height: 84%;
            object-fit: contain;
        }

        .eyebrow {
            color: #047857;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(34px, 7vw, 64px);
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 span {
            display: block;
            margin-top: 8px;
            color: #047857;
            font-size: 0.57em;
            letter-spacing: 5px;
        }

        .description {
            color: #a6b0c1;
            font-size: 14px;
            line-height: 1.8;
            margin: 24px auto 34px;
            max-width: 390px;
        }

        .start-btn {
            position: relative;
            min-width: 200px;
            padding: 17px 32px;
            background: #047857;
            color: #fff;
            border: none;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .start-btn:hover {
            background: #047857;
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(215, 181, 109, 0.2);
        }

        .start-btn:disabled {
            cursor: default;
            opacity: 0.8;
            transform: none;
        }

        .countdown {
            display: none;
            margin-top: 26px;
            color: #fff7d8;
        }

        .countdown.active {
            display: block;
            animation: reveal 0.3s ease;
        }

        .count-number {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .count-label {
            margin-top: 6px;
            font-size: 10px;
            letter-spacing: 4px;
            color: #a6b0c1;
        }

        .footer {
            position: absolute;
            bottom: 38px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            color: #68758a;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .line {
            width: 42px;
            height: 1px;
            background: #047857;
            margin: 0 auto 15px;
        }

        .hidden {
            display: none !important;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .opening::before {
                inset: 12px;
            }

            .logo-wrap {
                width: 125px;
                height: 125px;
                margin-bottom: 26px;
            }

            .eyebrow {
                letter-spacing: 3px;
                font-size: 9px;
            }

            h1 span {
                letter-spacing: 3px;
            }

            .description {
                font-size: 13px;
            }

            .footer {
                bottom: 28px;
                font-size: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="opening">
        <section class="content">

            <div class="logo-wrap">
                <!-- Place the official BCF logo in this folder -->
                <img src="./client/public/01M3YBY0TBEXJA8T8H0SWPY123.png" alt="BCF Logo" class="logo" onerror="this.style.display='none';
                    document.getElementById('logoFallback').style.display='block';">

                <div id="logoFallback" style="display:none;color:#047857;font-size:35px;
                    font-weight:800;letter-spacing:2px;">
                    BCF
                </div>
            </div>

            <h1>
                BCF
                <span>BANGLADESH CARROM FEDERATION</span>
            </h1>

            <p class="description" id="description">
                Welcome to the official carrom experience.
                Precision meets passion.
            </p>

            <button class="start-btn" id="startBtn" type="button">
                START
            </button>

            <div class="countdown" id="countdown" aria-live="polite">
                <div class="count-number" id="countNumber">10</div>
                <div class="count-label">Opening Official Website</div>
            </div>

        </section>
    </main>

    <script>
        const startBtn = document.getElementById("startBtn");
        const countdown = document.getElementById("countdown");
        const countNumber = document.getElementById("countNumber");
        const description = document.getElementById("description");

        let started = false;

        startBtn.addEventListener("click", () => {
            if (started) return;
            started = true;

            let seconds = 10;

            startBtn.classList.add("hidden");
            description.classList.add("hidden");
            countdown.classList.add("active");

            countNumber.textContent = seconds;

            const timer = setInterval(() => {
                seconds--;

                if (seconds > 0) {
                    countNumber.textContent = seconds;
                } else {
                    clearInterval(timer);
                    countNumber.textContent = "Get Ready!";
                    window.location.href = "http://localhost:5173/";
                }
            }, 1000);
        });
    </script>
</body>

</html>
